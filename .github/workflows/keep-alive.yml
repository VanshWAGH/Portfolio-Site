name: Keep Alive & Uptime Ping

on:
  schedule:
    # Runs every 6 hours to keep the deployment warm and active
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Ping Portfolio & Health Check
        run: |
          TARGET_URL="${{ secrets.SITE_URL || 'https://vanshwagh.vercel.app' }}"
          echo "Pinging $TARGET_URL ..."
          curl -f -s -o /dev/null -w "HTTP Status: %{http_code}\nTime Total: %{time_total}s\n" "$TARGET_URL/api/health" || curl -f -s -o /dev/null -w "Fallback HTTP Status: %{http_code}\n" "$TARGET_URL"
